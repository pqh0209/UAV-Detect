# WFB-ng — cấu hình PHÍA DRONE (Pi 4B trên UAV)
# wifi_channel và link_domain PHẢI GIỐNG HỆT trên trạm mặt đất (GS).
# Toàn bộ giá trị khác lấy mặc định từ wfb_ng/conf/master.cfg.

[common]
wifi_channel = 165     # 5825 MHz, độ rộng 20MHz — kênh mặc định của wfb-ng
wifi_region = 'VN'     # PHẢI khớp regdom của Pi (cmdline: VN). 'BO' cấm dải 5170-5250 → làm rớt WiFi onboard (wifi nhà kênh 44)
# Tên wlan0/wlan1 có thể đảo sau reboot — wfb-ng tự chọn card theo driver (rtl88xxau_wfb).

[drone]
link_domain = "default"

[drone_video]
peer = 'listen://0.0.0.0:5602'   # đẩy luồng RTP H.264 của camera vào UDP 5602
