# Không cho driver gốc chiếm card, chỉ dùng driver 88XXau_wfb (svpcom)
blacklist 88XXau
blacklist 8812au
blacklist 8812
# Công suất phát: 30 = mức "maximize output power" wfb-ng khuyến nghị cho 8812AU (thang 0-63).
# Đổi giá trị cần nạp lại driver (hoặc reboot). Theo dõi nhiệt card và nguồn USB.
options 88XXau_wfb rtw_tx_pwr_idx_override=30
