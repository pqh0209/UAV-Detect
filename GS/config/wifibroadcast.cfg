# Trạm mặt đất (Radxa Zero 3W) — phải khớp với UAV (Pi): kênh 165, link_domain "default".
# Các giá trị khác lấy mặc định của wfb-ng (master.cfg).
[common]
wifi_channel = 165     # 5825 MHz, 20 MHz
wifi_region = 'VN'     # VN cho phép kênh 165 và cả kênh 44 của WiFi onboard (wlan0)
wifi_txpower = 500     # 8812eu: dBm*100 → 5 dBm. Trạm mặt đất chủ yếu THU; hạ công suất phát để
                       # giảm dòng đỉnh (nguồn 5V đang sụt khi card phát → rớt USB). Tăng lại khi nguồn đã ổn.

[gs]
link_domain = "default"
